name: Notificacion CI 

on: 
  push: 
    branches: 
      -  main 

jobs: 
  enviar-alerta: 
    runs-on: ubuntu-latest 

    steps: 
      - name: Descargar repositorio 
        uses: actions/checkout@v4 

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
        node-version: 20

      - name: Ejecutar programa Hola Mundo 
        run: node app.js 

      - name: Enviar notificacion a ntfy 
        run: | 
        curl -H "Title: Nuevo Push" \ 
           -H "Priority: high" \
           -d "Se realizo un push a la rama main." \
         https://ntfy.sh/devops-itla